[project]
name = "kafka-test-framework"
version = "0.1.0"
description = "Kafka integration testing framework"
requires-python = ">=3.12"

dependencies = [
    "confluent-kafka>=2.12,<3",
    "hvac>=2.4,<3",
    "pydantic>=2.11,<3",
    "pytest>=8.4,<10",
    "allure-pytest>=2.16,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--alluredir=allure-results",
]
